<!doctype html>
{# tracker/templates/tracker/base.html #}
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Cadence{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'tracker/styles.css' %}">
    <link rel="icon" type="image/png" href="{% static 'tracker/cadence_favicon_multi.png' %}">
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-nav"
          aria-label="Open navigation"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>

        <a class="brand" href="{% url 'landing' %}">
          <img
            src="{% static 'tracker/cadence_favicon.png' %}"
            alt="Cadence"
            class="brand-logo"
          />
          <span>Cadence</span>
        </a>

        <nav id="primary-nav" class="nav" aria-label="Primary navigation">
          <a class="nav-link" href="{% url 'landing' %}" {% block nav_home %}{% endblock %}>Home</a>
          <a class="nav-link" href="{% url 'dashboard' %}" {% block nav_dashboard %}{% endblock %}>Demo</a>
          <a class="nav-link" href="{% url 'calendar' %}">Calendar</a>
          <a class="nav-link" href="{% url 'categories' %}" {% block nav_categories %}{% endblock %}>Categories</a>
          <a class="nav-link" href="{% url 'about' %}" {% block nav_about %}{% endblock %}>About</a>
<!--          <a class="nav-link" href="{% url 'login' %}">Sign in</a>-->
          {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="inline-form">
              {% csrf_token %}
              <button type="submit" class="nav-link nav-link-button">Sign out</button>
            </form>
          {% else %}
            <a class="nav-link" href="{% url 'login' %}">Sign in</a>
          {% endif %}
        </nav>

      </div>
    </header>

    <main class="container main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>Cadence • Django demo</small>
      </div>
    </footer>

    <script>
      (() => {
        const toggle = document.querySelector(".nav-toggle");
        const nav = document.querySelector("#primary-nav");

        if (!toggle || !nav) return;

        toggle.addEventListener("click", () => {
          const isOpen = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!isOpen));
          toggle.setAttribute("aria-label", isOpen ? "Open navigation" : "Close navigation");
          nav.classList.toggle("nav--open", !isOpen);
        });

        nav.querySelectorAll("a, button").forEach((element) => {
          element.addEventListener("click", () => {
            if (window.innerWidth <= 760) {
              toggle.setAttribute("aria-expanded", "false");
              toggle.setAttribute("aria-label", "Open navigation");
              nav.classList.remove("nav--open");
            }
          });
        });

        window.addEventListener("resize", () => {
          if (window.innerWidth > 760) {
            toggle.setAttribute("aria-expanded", "false");
            toggle.setAttribute("aria-label", "Open navigation");
            nav.classList.remove("nav--open");
          }
        });
      })();
    </script>
  </body>
</html>
