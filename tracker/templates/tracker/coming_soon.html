<!DOCTYPE html>
<html lang="en">
{% extends "tracker/base.html" %}

{% block title %}Coming Soon • Cadence{% endblock %}

{% block content %}
<section class="hero card card--hero">
  <div class="stack">
    <h1 class="page-title">{{ title }}</h1>
    <p class="subtext">{{ message }}</p>
    <p class="subtext">
      For now, you can still explore the app through the demo.
    </p>

    <div class="button-row">
      <a href="{% url 'dashboard' %}" class="btn btn-primary">Continue to demo</a>
      <a href="{% url 'landing' %}" class="btn btn-secondary">Back to home</a>
    </div>
  </div>
</section>
{% endblock %}
