{% extends "tracker/base.html" %}

{% block title %}Delete task • Cadence{% endblock %}

{% block content %}
<section class="hero card card--hero">
    <div class="stack stack--tight">
        <h1 class="page-title">Delete task</h1>
        <p class="subtext">Confirm that you want to remove this task.</p>
    </div>
</section>

<section class="card">
    <div class="stack">
        <p>
            Are you sure you want to delete
            <strong>{{ task.title }}</strong>?
        </p>

        <p class="subtext">
            This action cannot be undone.
        </p>

        <div class="button-row">
            <form method="post" class="inline-form">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">Delete task</button>
            </form>

            <a href="{% url 'task_detail' task.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</section>
{% endblock %}
